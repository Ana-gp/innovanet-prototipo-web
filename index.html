<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo web Innovanet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (guía visual) ===== */
:root{
  color-scheme: light;
  --blue:#00408F;        /* azul del logotipo */
  --blue-dark:#002D66;
  --blue-soft:#E8EEF8;
  --lime:#D4DA3C;        /* verde lima del logotipo */
  --lime-soft:#F6F8D2;
  --ink:#0E1B33;         /* texto */
  --muted:#4F5B70;
  --line:#D9DFEA;
  --bg:#FFFFFF;
  --soft:#F5F7FB;
  --font-display:'Poppins','Inter',system-ui,sans-serif; /* provisional hasta disponer de la licencia de la tipografía Bauhaus del cliente */
  --font-body:'Inter',system-ui,sans-serif;
  --r:14px;
  --max:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--blue);line-height:1.12;margin:0 0 .5em;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(34px,5vw,56px);font-weight:700}
h2{font-size:clamp(26px,3.4vw,38px)}
h3{font-size:21px;color:var(--ink)}
p{margin:0 0 1em}
a{color:var(--blue)}
img,svg{max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}

/* botones */
.btn{display:inline-flex;align-items:center;min-height:48px;gap:8px;font:600 16px/1 var(--font-display);padding:15px 24px;border-radius:999px;border:2px solid transparent;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-hablemos{background:var(--lime);color:var(--blue);border-color:var(--lime)}
.btn-hablemos:hover{background:#c5cc2c}
.btn-ghost{background:transparent;color:var(--blue);border-color:var(--blue)}
.btn-ghost:hover{background:var(--blue-soft)}
.link{font-weight:600;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:6px;display:inline-flex;align-items:center;min-height:44px;line-height:1.3}

/* cabecera */
.topbar{background:var(--blue);color:#fff;font-size:14px}
.topbar .wrap{display:flex;justify-content:flex-end;gap:24px;padding-top:7px;padding-bottom:7px}
.topbar a{color:#fff;text-decoration:none;font-weight:500}
header.site{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.logo img{height:54px;display:block}
nav.main{display:flex;align-items:center;gap:6px}
nav.main a,nav.main button.nav-btn{font:500 16px/1 var(--font-display);color:var(--ink);text-decoration:none;background:none;border:0;padding:12px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
nav.main a:hover,nav.main button.nav-btn:hover{background:var(--soft)}
@media (max-width:1080px){nav.main a,nav.main button.nav-btn{padding:12px 9px;font-size:15px}.menu-panel{right:24px}}
nav.main a[aria-current="page"],nav.main button.nav-btn.active{color:var(--blue);box-shadow:inset 0 -3px 0 var(--lime);border-radius:0}
nav.main a.nav-cta{margin:0 8px;padding:11px 18px;border:2px solid var(--blue);border-radius:999px;color:var(--blue);font-weight:600}
nav.main a.nav-cta:hover{background:var(--blue-soft)}
nav.main a.btn-hablemos{margin-left:8px;padding:14px 24px;background:var(--lime);color:var(--blue);border-radius:999px;font-weight:600}
nav.main a.btn-hablemos:hover{background:#c5cc2c}
nav.main a.btn-hablemos[aria-current="page"]{box-shadow:none;border-radius:999px}
.dl{width:16px;height:16px}
.drop{position:static}
header.site .wrap{position:relative}
.menu-panel{position:absolute;top:calc(100% - 6px);right:24px;left:auto;width:min(620px,calc(100vw - 48px));background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(14,27,51,.14);padding:14px;display:none;grid-template-columns:1fr 1fr;gap:4px}
.menu-panel.open{display:grid}
.menu-panel a{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;font:inherit}
.menu-panel a:hover{background:var(--blue-soft)}
.menu-panel .ic{flex:0 0 36px;height:36px;border-radius:10px;background:var(--blue-soft);display:grid;place-items:center}
.menu-panel b{display:block;font:600 15px/1.2 var(--font-display);color:var(--blue)}
.menu-panel small{display:block;font:400 13px/1.35 var(--font-body);color:var(--muted);margin-top:3px}
.burger{display:none;background:none;border:2px solid var(--blue);border-radius:12px;width:46px;height:46px;cursor:pointer;padding:0;align-items:center;justify-content:center}
.burger svg{width:24px;height:24px}
.mobile-panel{display:none}

/* secciones */
section{padding:84px 0}
.alt{background:var(--soft)}
.eyebrow{font:600 13px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:block}
.lead{font-size:20px;color:var(--muted);max-width:620px}

/* hero */
.hero{padding:64px 0 84px;background:linear-gradient(180deg,#fff 0%,var(--blue-soft) 100%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.ph{border-radius:var(--r);background:linear-gradient(135deg,var(--blue) 0%,#1B5BB0 55%,var(--lime) 140%);position:relative;overflow:hidden;display:block;width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.ph em{position:absolute;left:12px;bottom:10px;font:500 12px/1 var(--font-body);color:#fff;background:rgba(0,45,102,.7);padding:6px 10px;border-radius:999px;font-style:normal}

/* tarjetas de servicio */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:box-shadow .2s,transform .2s,border-color .2s}
a.card:hover{box-shadow:0 14px 30px rgba(14,27,51,.1);transform:translateY(-2px);border-color:var(--blue)}
.card .ic{width:48px;height:48px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;margin-bottom:6px}
.card h3{margin:0;color:var(--blue)}
.card p{margin:0;color:var(--muted);font-size:16px}
.card .more{margin-top:auto;padding-top:8px;font:600 15px var(--font-display);color:var(--blue)}
.helpbox{margin-top:28px;background:var(--lime-soft);border-radius:var(--r);padding:20px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.helpbox p{margin:0;font-weight:500}

/* cómo trabajamos */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{background:#fff;border-radius:var(--r);padding:26px;border:1px solid var(--line);position:relative}
.step:before{counter-increment:s;content:counter(s);font:700 15px var(--font-display);color:var(--blue);background:var(--lime);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px}
.step h3{margin-bottom:6px;color:var(--blue)}
.step p{margin:0;color:var(--muted);font-size:16px}
.values{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font:600 14px var(--font-display);text-decoration:none}
a.chip:hover{background:var(--lime)}

/* blog */
.post{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink)}
.post .ph{aspect-ratio:16/9}
.post h3{margin:0;color:var(--blue)}
.post small,.meta{color:var(--muted);font-size:14px}
.tag{display:inline-block;font:600 12px var(--font-display);padding:5px 10px;border-radius:999px;background:var(--lime-soft);color:var(--blue-dark)}
a.post:hover h3{text-decoration:underline}

/* banda cta */
.band{background:var(--blue);color:#fff;border-radius:22px;padding:48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.band h2{color:#fff;margin:0 0 6px}
.band p{margin:0;color:#dbe6f7}
.band .phone{font:600 22px var(--font-display);color:#fff;text-decoration:none;display:inline-block;margin-top:4px;padding:10px 0}

/* pie */
footer.site{background:var(--ink);color:#cfd8e8;padding:60px 0 28px;font-size:15px}
footer.site .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:36px}
footer.site h4{color:#fff;font-size:15px;margin-bottom:14px}
footer.site a{color:#cfd8e8;text-decoration:none;display:block;padding:11px 0;margin:0;min-height:44px}
footer.site a:hover{color:var(--lime)}
footer.site .logo-w{background:#fff;border-radius:12px;padding:10px 14px;display:inline-block;margin-bottom:14px}
footer.site .logo-w img{height:46px;display:block}
footer.site .legal{border-top:1px solid #2a3a5a;margin-top:36px;padding-top:20px;font-size:13px;color:#93a3c0}

/* página interior */
.herogrid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.pagehead{background:linear-gradient(180deg,#fff,var(--blue-soft));padding:44px 0 56px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:18px}
.crumbs a{color:var(--muted);display:inline-block;padding:13px 6px;margin:-13px -2px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:40px;align-items:start}
.acc{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:12px;overflow:hidden}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;padding:20px 24px;font:600 18px/1.3 var(--font-display);color:var(--blue);text-align:left;cursor:pointer;min-height:64px}
.acc button:hover{background:var(--soft)}
.acc .pm{flex:0 0 28px;height:28px;border-radius:50%;background:var(--lime);display:grid;place-items:center;transition:transform .2s}
.acc[data-open="true"] .pm{transform:rotate(45deg)}
.acc .body{display:none;padding:0 24px 22px;color:var(--muted)}
.acc[data-open="true"] .body{display:block}
.acc[data-open="true"]{border-color:var(--blue)}
.aside{position:sticky;top:110px;background:var(--blue);color:#fff;border-radius:var(--r);padding:28px}
.aside h3{color:#fff}
.aside p{color:#dbe6f7;font-size:16px}
.aside .phone{display:block;font:600 22px var(--font-display);color:#fff;text-decoration:none;margin:4px 0 12px;padding:10px 0}
.pending{border:2px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);background:#fff}
.note{font-size:13px;color:var(--muted);margin-top:8px}

/* conócenos */
.homeblog{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.homeblog .ph{aspect-ratio:16/9}
.rowimg{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-bottom:72px}
.rowimg:nth-child(even) .ph{order:2}
.rowimg .ph{aspect-ratio:4/3}

/* contacto */
form.f{display:grid;gap:18px}
label{font:600 15px var(--font-display);color:var(--ink);display:block;margin-bottom:6px}
input,select,textarea{width:100%;font:400 17px var(--font-body);padding:14px 16px;border:1.5px solid #AEB8CB;border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
textarea{min-height:130px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;min-height:44px;font-size:15px;color:var(--muted)}
.check input{width:22px;height:22px;margin-top:2px;flex:0 0 22px}
.ch{display:flex;gap:16px;align-items:flex-start;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:14px;text-decoration:none;color:var(--ink)}
.ch .ic{flex:0 0 46px;height:46px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center}
.ch b{display:block;font:600 14px var(--font-display);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.ch span{font:600 22px/1.25 var(--font-display);color:var(--blue)}
.ch span.sm{font-size:17px}
.ok{display:none;background:var(--lime-soft);border-radius:12px;padding:16px 18px;font-weight:500}

/* artículo */
.article{max-width:760px;margin:0 auto}
.article h2{font-size:28px;margin-top:1.6em}
.article .ph{aspect-ratio:16/8;margin:24px 0}

ol.rsteps{list-style:none;counter-reset:s;margin:18px 0;padding:0;display:grid;gap:12px}
ol.rsteps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
ol.rsteps li::before{content:counter(s);flex:0 0 32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font:600 15px var(--font-display);display:grid;place-items:center}
ol.rsteps b{font-family:var(--font-display);font-weight:600}
.warn{border-left:5px solid var(--blue);background:var(--blue-soft);border-radius:0 12px 12px 0;padding:14px 16px;font-size:16px;margin:0 0 20px}
.rbox{margin-top:44px;border:1px solid var(--line);border-radius:var(--r);padding:26px;background:#fff}
.rbox h2{font-size:26px;margin:0 0 4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{font:400 14px var(--font-body);color:var(--muted)}
.trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.protochip{position:fixed;left:14px;bottom:14px;z-index:150;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;color:var(--muted);box-shadow:0 4px 14px rgba(14,27,51,.1)}
.shot .protochip{display:none}

/* ===== móvil ===== */
@media (max-width:900px){
  body{font-size:17px}
  section{padding:56px 0}
  .topbar{display:none}
  header.site .wrap{height:68px}
  .logo img{height:46px}
  nav.main{display:none}
  .burger{display:inline-flex}
  .mobile-panel{position:fixed;inset:68px 0 0 0;background:#fff;z-index:60;padding:20px 20px 40px;overflow:auto;flex-direction:column;gap:6px}
  .mobile-panel.open{display:flex}
  .mobile-panel a.m,.mobile-panel button.m{display:flex;justify-content:space-between;align-items:center;font:600 20px var(--font-display);color:var(--ink);text-decoration:none;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 4px;min-height:60px;text-align:left;width:100%;cursor:pointer}
  .mobile-panel .sub{display:none;padding:6px 0 10px 8px}
  .mobile-panel .sub.open{display:block}
  .mobile-panel .sub a{display:block;padding:14px 8px;font:500 17px var(--font-body);color:var(--blue);text-decoration:none;min-height:48px}
  .mobile-panel .btn{justify-content:center;margin-top:18px;width:100%;padding:18px}
  .mobile-panel .tel{margin-top:14px;text-align:center;color:var(--muted)}
  .mobile-panel .tel a{font:600 20px var(--font-display);display:block;color:var(--blue);text-decoration:none;margin-top:4px}
  .hero{padding:36px 0 56px}
  .homeblog{grid-template-columns:1fr}
  .hero .wrap,.two,.rowimg,.grid3,.steps,footer.site .cols{grid-template-columns:1fr}
  .hero .ph{aspect-ratio:16/10}
  .hero .cta .btn{width:100%;justify-content:center}
  .rowimg{gap:20px;margin-bottom:44px}
  .rowimg:nth-child(even) .ph{order:0}
  .band{padding:30px 24px}
  .band .btn{width:100%;justify-content:center}
  .aside{position:static}
  .grid3{gap:14px}
  .helpbox .btn{width:100%;justify-content:center}
  #featured{grid-template-columns:1fr !important;gap:20px !important;margin-bottom:40px !important}
  .row2{grid-template-columns:1fr}
  .herogrid{grid-template-columns:1fr;gap:24px}
}
</style>
</head>

 <div><h2 style="font-size:28px">Escríbenos</h2>

  <div class="row2"><div><label for="n">Nombre</label><input id="n" required autocomplete="name"></div>

  <div class="row2"><div><label for="e">Correo electrónico</label><input id="e" type="email" required autocomplete="email"></div>

  <div><label for="m">¿En qué podemos ayudarte?</label><textarea id="m" required></textarea></div>
  <div><label for="c">¿Cómo nos has conocido?</label><select id="c"><option value="">Selecciona una opción</option><option>Búsqueda en internet</option><option>Recomendación</option><option>Ya soy cliente</option><option>Otro</option></select></div>
  <label class="check" style="font:400 15px var(--font-body)"><input type="checkbox" required><span>He leído y acepto la <a href="#" data-legal style="color:var(--blue);display:inline-block;padding:13px 0;margin:-13px 0">política de privacidad</a>.</span></label>
  <div><button class="btn btn-primary" type="submit">Enviar mensaje</button><p class="note" style="margin-top:12px">Usaremos tus datos solo para responder a tu mensaje. Texto legal definitivo: fase final.</p></div>
  <div class="ok" id="ok" role="status">Formulario de ejemplo: en el prototipo no se envía ningún mensaje.</div>
 </form></div>
 <div><h2 style="font-size:28px">O contacta directamente</h2>
  <a class="ch" href="tel:+34987264073"><span class="ic">${ICON.phone}</span><div><b>Teléfono</b><span>${PHONE}</span></div></a>
  <a class="ch" href="mailto:${MAIL}"><span class="ic">${ICON.mail}</span><div><b>Correo</b><span class="sm">${MAIL}</span></div></a>
  <div class="ch"><span class="ic">${ICON.pin}</span><div><b>Dirección</b><span class="sm">${ADDR}</span></div></div>
 </div></div></section>
<section class="alt" id="faq"><div class="wrap" style="max-width:860px"><span class="eyebrow">Preguntas frecuentes</span><h2>Antes de escribirnos</h2>
 ${accordion([['¿Cuánto tardáis en responder?','Pregunta de ejemplo provisional. La respuesta real la aportará Innovanet.'],['¿Trabajáis con autónomos y pequeñas empresas?','Pregunta de ejemplo provisional. La respuesta real la aportará Innovanet.'],['¿Puedo pedir ayuda si ya soy cliente?','Pregunta de ejemplo provisional. La respuesta real la aportará Innovanet.']])}
 <p class="note">Preguntas y respuestas de ejemplo: contenido provisional.</p></div></section>`}

const POSTS=[['Por qué importan las copias de seguridad en una pequeña empresa','Ciberseguridad'],['Cómo empezar a usar la IA en tu trabajo sin riesgos','IA'],['Tres señales de que tu red necesita una revisión','Redes'],['Qué es la protección de datos y a quién afecta','Privacidad']];
function pgBlog(){return `
<div class="pagehead"><div class="wrap"><div class="crumbs"><a href="#/">Inicio</a> › Blog</div><h1>Blog</h1><p class="lead">Artículos para entender la tecnología y proteger tu empresa.</p></div></div>
<section><div class="wrap">
 <a class="post" href="#/blog/ejemplo" style="display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center;margin-bottom:56px" id="featured">${IMG_BACKUP}<div><span class="tag">Ejemplo provisional</span><h2 style="margin-top:12px">${POSTS[0][0]}</h2><p class="meta">Fecha provisional · Lectura de 4 min</p><p style="color:var(--muted)">Texto de ejemplo de la entrada destacada. El contenido real lo aportará Innovanet.</p><span class="link">Leer artículo</span></div></a>
 <h3 style="margin-bottom:22px">Más artículos</h3>
 <div class="grid3">${POSTS.slice(1).map(p=>`<a class="post" href="#/blog/ejemplo">${PH('Imagen provisional · IA','16/9')}<span class="tag">${p[1]} · ejemplo</span><h3>${p[0]}</h3><small>Fecha provisional</small></a>`).join('')}</div>
 <p class="note" style="margin-top:28px">El día del lanzamiento habrá un artículo; el resto de las tarjetas muestra cómo crecerá el listado. Todo el contenido es de ejemplo.</p>
</div></section>${bandCTA}`}
function pgPost(){return `
<div class="pagehead"><div class="wrap"><div class="crumbs"><a href="#/">Inicio</a> › <a href="#/blog">Blog</a> › Artículo</div><div class="article" style="margin:0"><span class="tag">Ejemplo provisional</span><h1 style="margin-top:14px">${POSTS[0][0]}</h1><p class="meta">Fecha provisional · Lectura de 4 min</p></div></div></div>
<section><div class="wrap"><article class="article">
 ${PHOTO(SRC_BACKUP,ALT_BACKUP,'16/8')}
 <p class="lead" style="max-width:none">Texto de ejemplo: un párrafo de entrada que resume el artículo y explica por qué le interesa al lector.</p>
 <p>Texto de ejemplo. El cuerpo del artículo se maquetará con párrafos cortos, subtítulos claros y listas cuando haga falta, con una longitud de línea cómoda para leer en cualquier pantalla.</p>
 <h2>Un subtítulo de ejemplo</h2>
 <p>Texto de ejemplo. Los subtítulos ayudan a recorrer el artículo y a encontrar la parte que interesa sin leerlo entero.</p>
 <ul><li>Punto de ejemplo uno</li><li>Punto de ejemplo dos</li><li>Punto de ejemplo tres</li></ul>
 <div class="helpbox"><p>¿Quieres hablar de esto con nosotros?</p><a class="btn btn-hablemos" href="#/contacto">Hablemos</a></div>
 <p style="margin-top:36px"><a class="link" href="#/blog">← Volver al Blog</a></p>
</article></div></section>`}

/* ----- router ----- */
const routes={
 '/':pgHome,'/conocenos':pgAbout,'/contacto':pgContact,'/blog':pgBlog,'/blog/ejemplo':pgPost
};
function route(){
  const raw=location.hash.replace(/^#/,'')||'/';
  const [path,anchor]=raw.split('#');
  let r=path.startsWith('/')?path:'/';
  let html;
  if(r.startsWith('/servicios/')) html=pgService(r.split('/')[2]);
  else html=(routes[r]||pgHome)();
  $('#main').innerHTML=html;
  $('#nav').innerHTML=navHTML(r);
  $('#mpanel').innerHTML=mobileHTML();
  $('#footer').innerHTML=footerHTML();
  closeMobile();
  wire();
  if(anchor){setTimeout(()=>{const el=document.getElementById(anchor);if(el)el.scrollIntoView()},30)}
  else window.scrollTo(0,0);
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2800)}
function closeMobile(){const p=$('#mpanel');p.classList.remove('open');$('#burger').setAttribute('aria-expanded','false');$('#bpath').setAttribute('d','M4 7h16M4 12h16M4 17h16');document.body.style.overflow=''}
function wire(){
    document.querySelectorAll('[data-legal]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();toast('Texto legal: se incorporará en la fase final')}));
  const b=$('#svcbtn'),p=$('#svcpanel');
  if(b){b.addEventListener('click',e=>{e.stopPropagation();const o=p.classList.toggle('open');b.setAttribute('aria-expanded',o)});}
  document.querySelectorAll('.acc button').forEach(btn=>btn.addEventListener('click',()=>{const a=btn.parentElement;const o=a.dataset.open==='true';a.dataset.open=!o;btn.setAttribute('aria-expanded',!o)}));
  const f=$('#form');if(f)f.addEventListener('submit',e=>{e.preventDefault();$('#ok').style.display='block'});
  const m=$('#msvc');if(m)m.addEventListener('click',()=>{const s=$('#msub');const o=s.classList.toggle('open');m.setAttribute('aria-expanded',o)});
}
document.addEventListener('click',e=>{const p=$('#svcpanel');if(p&&p.classList.contains('open')&&!e.target.closest('.drop')){p.classList.remove('open');$('#svcbtn').setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const p=$('#svcpanel');if(p)p.classList.remove('open');closeMobile()}});
$('#burger').addEventListener('click',()=>{const p=$('#mpanel');const o=p.classList.toggle('open');$('#burger').setAttribute('aria-expanded',o);$('#bpath').setAttribute('d',o?'M6 6l12 12M18 6L6 18':'M4 7h16M4 12h16M4 17h16');document.body.style.overflow=o?'hidden':''});
window.addEventListener('hashchange',route);
if(new URLSearchParams(location.search).has('shot'))document.body.classList.add('shot');
route();
</script>
</body>
</html>
